name: release-binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (MAJOR.MINOR.PATCH, higher than the last release)"
        required: true
        type: string
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
      notes:
        description: Highlights for the release notes (Markdown; empty uses RELEASE_NOTES.md if present)
        type: string
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      macos:
        description: Build macOS too (GitHub's macOS runners are often unavailable; without one the macOS job waits, then the release goes out without it)
        type: boolean
        default: false
      include_whats_new:
        description: Include the staged What's New notes for this release
        type: boolean
        default: false
      nsight_aftermath:
        description: Build Windows with Nsight Aftermath GPU crash dumps (test builds only, no NVIDIA files shipped)
        type: boolean
        default: false

permissions:
  contents: read

# Clang major the Linux PGO build uses, from apt.llvm.org. A profile is written by a current clang
# and an older reader refuses it, so this has to stay at or above whatever produced
# eglantine.profdata; bump it when a refreshed profile needs a newer LLVM.
env:
  PGO_LLVM_VERSION: "23"

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      build: ${{ steps.nightly.outputs.build || 'true' }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The Linux -pgo builds are the same programs compiled by clang against the repo's
      # eglantine.profdata. Eden's profile (Eden-CI/PGO) comes from Switch 1 games: with it Mario
      # Kart World ran at about half the speed of the normal build, with eglantine.profdata at
      # about the same speed. Both Windows builds are clang-cl with ThinLTO; windows-x86_64-pgo
      # adds eden-windows.profdata, an MSVC-ABI profile trained on Ocarina of Time (see
      # docs/CI.md). Linux ARM64 has no PGO build (as in upstream #2532). MSVC still builds for development. macOS only when asked for: a macOS job
      # GitHub has no runner for fails the whole run.
      - name: Choose platforms
        id: platforms
        shell: bash
        env:
          WITH_MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          matrix='[
            {"platform": "linux-x86_64", "runner": "ubuntu-24.04"},
            {"platform": "linux-x86_64-pgo", "runner": "ubuntu-24.04", "pgo": true},
            {"platform": "windows-x86_64", "runner": "windows-2022"},
            {"platform": "windows-x86_64-pgo", "runner": "windows-2022", "pgo": true, "profile": "eden-windows.profdata"},
            {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm"}'
          if [[ "$WITH_MACOS" == true ]]; then
            matrix+=',
            {"platform": "macos-arm64", "runner": "macos-15"}'
          fi
          matrix+=']'
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq -r '.[].platform' <<<"$matrix"
      - name: Skip a nightly run for a commit nx2 already built
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh run list -R "$GITHUB_REPOSITORY" -w release-binaries.yml -b nx2 -s success -L 1 \
            --json headSha --jq '.[0].headSha // ""')
          echo "build=$([ "$built" = "$GITHUB_SHA" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish an Aftermath build
        if: inputs.nsight_aftermath && inputs.publish_release
        run: |
          echo "nsight_aftermath builds are test builds; run them with publish_release=false"
          exit 1

      # Releases are tagged vMAJOR.MINOR.PATCH and the binaries carry that tag (EDEN_BUILD_TAG): the
      # updater offers a release whose version is higher than the running build's, and treats the
      # earlier build-N releases as older than any version. A run that doesn't publish gets a
      # test-N tag, which the binaries report as a development build.
      - name: Choose version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          version="${version//[[:space:]]/}"
          if [[ "$PUBLISH" != true ]]; then
            echo "tag=test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "version=test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$version" == 0.0.0 ]]; then
            echo "::error::Enter the version to release as MAJOR.MINOR.PATCH, for example 1.0.0 (got '${INPUT_VERSION}')"
            exit 1
          fi
          tag="v${version}"
          # Refuse a version at or below one already released: the updater would never offer it.
          newest=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n1)" != "$version" ]] \
              || [[ "$newest" == "$version" ]]; then
            echo "::error::Version $version is not higher than the last release, $newest"
            exit 1
          fi
          echo "Releasing Eden NX2 $version as $tag (last release: ${newest:-none})"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release tag
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              # A tag without a release is what a failed run leaves behind: move it to this commit.
              # A released version's tag is never moved.
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>&1; then
                echo "::error::$tag is already released (from $tag_sha); choose a higher version"
                exit 1
              fi
              echo "Moving $tag, left by a failed run at $tag_sha, to $GITHUB_SHA"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" \
                -f "sha=$GITHUB_SHA" -F force=true >/dev/null
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    env:
      EDEN_USE_PENDING_RELEASE_NOTES: ${{ inputs.publish_release && inputs.include_whats_new && 'ON' || 'OFF' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # The Azure Ubuntu mirror the x86-64 runners use sometimes serves these packages at a few
      # hundred KB/s, which made this step take 20 to 40 minutes, so their .deb files are cached.
      - name: Restore apt packages
        if: startsWith(matrix.platform, 'linux-x86_64')
        id: apt-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ matrix.platform }}-v1-${{ github.run_id }}
          restore-keys: |
            apt-${{ matrix.platform }}-v1-

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          bash .ci/linux/fast-apt.sh
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          echo "APT_DEBS_RESTORED=$(find "$RUNNER_TEMP/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_ENV"
          echo "Dir::Cache::Archives \"$RUNNER_TEMP/apt-archives\";" |
            sudo tee /etc/apt/apt.conf.d/90eden-archives > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache llvm python3-zstandard \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # The packages docs/Deps.md lists for macOS, plus ccache. The runner image can carry a
      # freetype 2.15.0 bottle that links /usr/lib/libhvf.dylib, which macOS has only from 15.4, so
      # the bundled copy stopped the app from starting on 15.0 to 15.3 (#892). Homebrew rebuilt the
      # Sequoia bottle without HVF (homebrew-core 85373af); a rebuilt bottle keeps the version
      # number, so only an updated tap and an explicit reinstall replace the image's copy.
      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache
          freetype="$(brew --prefix freetype)/lib/libfreetype.6.dylib"
          if otool -L "$freetype" | grep -F /usr/lib/libhvf.dylib > /dev/null; then
            brew update --quiet
            HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew reinstall freetype
            if otool -L "$freetype" | grep -F /usr/lib/libhvf.dylib; then
              echo "::error::$freetype still links libhvf.dylib, which macOS 15.0 to 15.3 lack"
              exit 1
            fi
          fi

      - name: Install Qt on Linux x86_64
        if: startsWith(matrix.platform, 'linux') && runner.arch != 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtimageformats
          cache: true

      - name: Install Qt on Linux ARM64
        if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts qtimageformats
          cache: true

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so take clang from the LLVM
      # apt repo. The versioned packages are named explicitly: that repo's unversioned clang/lld
      # metapackages can lag the binaries they depend on and then resolve to nothing. lld-23 only
      # ships ld.lld under /usr/lib/llvm-23/bin, so -B points the linker search there.
      - name: Install clang for PGO
        if: startsWith(matrix.platform, 'linux') && matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          bash .ci/linux/fast-apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      # Branch builds restore nx2's caches without saving their own, which no other branch can
      # restore: only nx2 saves and keeps one entry per cache family (docs/CI.md).
      # A new snapshot is saved only when this run downloaded packages the cache lacked.
      - name: Drop superseded apt packages
        if: startsWith(matrix.platform, 'linux-x86_64') && github.ref == 'refs/heads/nx2'
        id: apt-trim
        shell: bash
        run: |
          if [ "$(find "$RUNNER_TEMP/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)" = "$APT_DEBS_RESTORED" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get autoclean
          sudo rm -rf "$RUNNER_TEMP/apt-archives/partial" "$RUNNER_TEMP/apt-archives/lock"
          sudo chown -R "$USER" "$RUNNER_TEMP/apt-archives"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save apt packages
        if: steps.apt-trim.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # The profiles are in the source tree, where the Linux and Windows configure steps read them.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.profile || 'eglantine.profdata' }}"

      - name: Set up MSVC
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        if: startsWith(matrix.platform, 'windows')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts qtimageformats
          cache: true

      # ccache rather than sccache, as in build-check: sccache has no direct mode for clang-cl, so
      # every hit still ran the preprocessor and a build with 96% hits compiled for 13 minutes.
      - name: Install ccache on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: glslangValidator --version

      # Only the SDK's headers are kept: the tracker loads GFSDK_Aftermath_Lib.x64.dll at run time,
      # so the tester supplies his own copy and the artifact holds no NVIDIA files.
      - name: Fetch Nsight Aftermath SDK headers
        if: startsWith(matrix.platform, 'windows') && inputs.nsight_aftermath
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'aftermath-sdk.zip'
          Invoke-WebRequest -OutFile $zip https://developer.nvidia.com/downloads/assets/tools/secure/nsight-aftermath-sdk/2026_3_0/windows_x64/NVIDIA_Nsight_Aftermath_SDK_2026.3.0.26197-windows_x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'e38136a60110199559b7365d3ea4ec0cb5588dc2b0f593877d864e0299659a3f') {
            throw "Nsight Aftermath SDK hash $hash does not match the pinned release"
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'aftermath-sdk-zip'
          Expand-Archive $zip -DestinationPath $extracted
          $sdk = Join-Path $env:RUNNER_TEMP 'aftermath-sdk'
          New-Item -ItemType Directory -Force $sdk | Out-Null
          Move-Item (Join-Path $extracted 'include') $sdk
          Remove-Item -Recurse -Force $extracted, $zip
          "NSIGHT_AFTERMATH_SDK=$($sdk -replace '\\', '/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .lto-cache
          # The profile's hash is part of the key, so objects built against an older profile are
          # never restored.
          key: objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v3-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v3-${{ github.sha }}-
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v3-

      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DEDEN_TESTS=OFF
            -DEDEN_CMD=ON
            -DEDEN_ROOM=OFF
            -DEDEN_ROOM_STANDALONE=OFF
            -DEDEN_USE_BUNDLED_QT=OFF
            -DENABLE_QT_TRANSLATION=ON
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DEDEN_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=ON
            -DEDEN_BUILD_TAG=${{ needs.prepare-release.outputs.tag }}
            -DEDEN_UPDATE_REPO=${{ github.repository }}
            "-DEDEN_USE_PENDING_RELEASE_NOTES=$EDEN_USE_PENDING_RELEASE_NOTES"
            -DEDEN_BUILD_PLATFORM=${{ matrix.platform }}
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            # Same flags Eden's CI passes for its clang PGO build.
            profile="-fprofile-use=$PWD/eglantine.profdata -Wbackend-plugin -Wno-error=backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      # A profile older than the source only warns: functions changed since training lose their
      # profile data and are optimized as in the ThinLTO build. clang-cl 22 reads LLVM's indexed
      # profile format 13, so the profile must come from the LLVM that tools/windows installs.
      - name: Configure Windows
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          if [ -n '${{ matrix.profile }}' ]; then
            flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
          fi
          # The ThinLTO backend runs at link time, which ccache doesn't cover; lld caches each
          # module's native code, so a link only recompiles the modules that changed. One build's
          # entries take 1.3 GB.
          lto_cache="/lldltocache:$(cygpath -m "$PWD/.lto-cache") /lldltocachepolicy:cache_size_bytes=1500m"
          aftermath=()
          if [ '${{ inputs.nsight_aftermath }}' = true ]; then
            aftermath=(-DENABLE_NSIGHT_AFTERMATH=ON)
          fi
          cmake -S . -B build/release -G Ninja "${aftermath[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DEDEN_TESTS=OFF \
            -DEDEN_CMD=ON \
            -DEDEN_ROOM=OFF \
            -DEDEN_ROOM_STANDALONE=OFF \
            -DEDEN_USE_BUNDLED_QT=OFF \
            -DENABLE_FLYHIGH=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DEDEN_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DEDEN_BUILD_TAG=${{ needs.prepare-release.outputs.tag }} \
            -DEDEN_UPDATE_REPO=${{ github.repository }} \
            "-DEDEN_USE_PENDING_RELEASE_NOTES=$EDEN_USE_PENDING_RELEASE_NOTES" \
            -DEDEN_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /OPT:REF /OPT:ICF $lto_cache" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Configure macOS
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DEDEN_TESTS=OFF \
            -DEDEN_CMD=ON \
            -DEDEN_ROOM=OFF \
            -DEDEN_ROOM_STANDALONE=OFF \
            -DEDEN_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DEDEN_BUILD_TAG=${{ needs.prepare-release.outputs.tag }} \
            -DEDEN_UPDATE_REPO=${{ github.repository }} \
            "-DEDEN_USE_PENDING_RELEASE_NOTES=$EDEN_USE_PENDING_RELEASE_NOTES" \
            -DEDEN_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Save CPM downloads
        if: github.ref == 'refs/heads/nx2' && steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call. Entries this build didn't use are evicted, so the saved cache
      # stays the size of one build.
      - name: Build
        shell: bash
        env:
          CCACHE_COMPILERCHECK: ${{ startsWith(matrix.platform, 'windows') && format('string:{0}', hashFiles('tools/windows/install-llvm.ps1')) || 'content' }}
        run: |
          ccache --zero-stats
          start=$(date +%s)
          targets="eden eden-cmd"
          if [[ "${{ matrix.platform }}" == windows* ]]; then targets="$targets eden-updater"; fi
          if [[ '${{ matrix.pgo }}' == 'true' ]]; then
            if cmake --build build/release --target $targets --parallel 2>&1 |
                tee --output-error=warn "$RUNNER_TEMP/pgo-build.log"; then
              awk -v platform='${{ matrix.platform }}' '
                /function control flow change detected \(hash mismatch\).* up to [0-9]+ count discarded/ {
                  total++
                  if ($0 ~ / up to [1-9][0-9]* count discarded/) nonzero++
                }
                END {
                  printf "### PGO profile mismatches: %s\n\n", platform
                  printf "- Discarded profile warnings: %d\n- With nonzero counts: %d\n", total, nonzero
                }
              ' "$RUNNER_TEMP/pgo-build.log" >> "$GITHUB_STEP_SUMMARY" ||
                echo "::warning::Could not write PGO mismatch summary"
            else
              build_status=${PIPESTATUS[0]}
              if (( build_status != 0 )); then exit "$build_status"; fi
              echo "::warning::Could not capture PGO build output for the job summary"
            fi
          else
            cmake --build build/release --target $targets --parallel
          fi
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - start + 60 ))s"
          du -sh .ccache .lto-cache 2> /dev/null || true

      - name: Save compiler objects
        if: github.ref == 'refs/heads/nx2' && !cancelled() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .lto-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Delete superseded caches
        if: github.ref == 'refs/heads/nx2' && !cancelled()
        continue-on-error: true
        shell: bash
        # The platform is spelled out rather than passed as PLATFORM: Windows variable names ignore
        # case, and the MSVC environment's Platform=x64 replaced it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci/prune-caches.sh '^objects-${{ matrix.platform }}(-[0-9a-f]{64})?-v[0-9]+-' '${{ steps.compiler-cache.outputs.cache-primary-key }}'
          tools/ci/prune-caches.sh '^cpm-${{ matrix.platform }}-v[0-9]+-' '${{ steps.cpm-cache.outputs.cache-primary-key }}'
          tools/ci/prune-caches.sh '^apt-${{ matrix.platform }}-v[0-9]+-' '${{ steps.apt-cache.outputs.cache-primary-key }}'

      # fsr4-vk, the community Vulkan port of FSR 4 that the x86-64 Linux packages ship
      # (tools/fsr4-vk/build.sh pins its commit and AMD's DLL it is built from). The build's inputs
      # are all in the script, so its output is cached by the script's hash. Its shader conversion
      # fails its own asset check on arm64 hosts, so the aarch64 packages go without it.
      - name: Restore fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64')
        id: fsr4-vk
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/fsr4-vk
          key: fsr4-vk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fsr4-vk/build.sh') }}

      - name: Build fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64') && steps.fsr4-vk.outputs.cache-hit != 'true'
        shell: bash
        run: bash tools/fsr4-vk/build.sh "$RUNNER_TEMP/fsr4-vk-work" "$RUNNER_TEMP/fsr4-vk"

      - name: Save fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64') && steps.fsr4-vk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/fsr4-vk
          key: ${{ steps.fsr4-vk.outputs.cache-primary-key }}

      # Both Linux packages are self-contained: linuxdeploy bundles every library the two programs
      # need except the base system ones (glibc, X11/Wayland client libraries, the GPU driver and
      # Vulkan loader), and its Qt plugin adds the Qt libraries and platform plugins. linuxdeploy's
      # own exclude list lacks libvulkan.so.1, which fsr4-vk and the -pgo builds' libplacebo link,
      # so it is excluded by name: the bundled loader replaced the system one and failed Vulkan
      # init (#1767). The AppImage packs that folder into one file; the tar.gz holds the same
      # folder for systems without FUSE, with eden and eden-cli links at its top. Both run on
      # glibc 2.39+ systems. A tar.gz of the bare programs needed the Qt 6.8 they were built
      # against installed system-wide (#901).
      - name: Package Linux AppImage and tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/eden
          test -x build/release/bin/eden-cli
          strip build/release/bin/eden build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)   # aarch64 or x86_64
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon com.eden.eden_nx2.
          icon="$RUNNER_TEMP/com.eden.eden_nx2.png"
          cp dist/qt_themes/default/icons/256x256/eden.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Include Wayland platform plugins and their graphics/shell integrations.
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          # Embedded in the AppImage metadata: the release's version plus the commit.
          export LDAI_VERSION="${{ needs.prepare-release.outputs.version }}-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="eden-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          mkdir -p AppDir/usr/bin AppDir/usr/share/licenses
          cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
          # The emulator loads fsr4-vk from <exe dir>/../lib (FfxRuntime::PortLibrary).
          fsr4=amd_fidelityfx_upscaler_vk.so
          fsr4_library=()
          if [ "$arch" = x86_64 ]; then
            cp -r "$RUNNER_TEMP/fsr4-vk/licenses/fsr4-vk" AppDir/usr/share/licenses/
            fsr4_library=(--library "$RUNNER_TEMP/fsr4-vk/$fsr4")
          fi
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/eden \
            --executable build/release/bin/eden-cli \
            "${fsr4_library[@]}" \
            --exclude-library 'libvulkan.so*' \
            --desktop-file dist/com.eden.eden_nx2.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"
          test -f AppDir/usr/bin/qt.conf
          mv AppDir eden
          ln -s usr/bin/eden eden/eden
          ln -s usr/bin/eden-cli eden/eden-cli
          tar -czf "eden-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" eden
          ls -la "eden-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"
          if tar -tzf "eden-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" | grep '/libvulkan\.so'; then
            echo "::error::The package bundles the Vulkan loader"
            exit 1
          fi
          # Both x86-64 packages must carry fsr4-vk and its licences.
          if [ "$arch" = x86_64 ]; then
            test "$(tar -tzf "eden-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" |
              grep -cFx -e "eden/usr/lib/$fsr4" -e eden/usr/share/licenses/fsr4-vk/LICENSE \
                -e eden/usr/share/licenses/fsr4-vk/AMD-FidelityFX-SDK-license.md)" = 3
            extract="$RUNNER_TEMP/appimage-check"
            mkdir -p "$extract"
            (cd "$extract" &&
              "$GITHUB_WORKSPACE/$LDAI_OUTPUT" --appimage-extract "usr/lib/$fsr4" > /dev/null)
            cmp "$extract/squashfs-root/usr/lib/$fsr4" "eden/usr/lib/$fsr4"
            nm -D --defined-only "eden/usr/lib/$fsr4" | grep -w ffxCreateContext
          fi

      - name: Package Windows binary
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          foreach ($file in 'eden.exe', 'eden-cli.exe', 'flyhigh.dll', 'licenses/flyhigh/LICENSE', 'licenses/flyhigh/NOTICE') {
            if (-not (Test-Path "build/release/bin/$file" -PathType Leaf)) {
              throw "build/release/bin/$file was not produced"
            }
          }
          # Symbols ship as their own artifact, not in the release zip.
          New-Item -ItemType Directory -Force build/release/symbols | Out-Null
          Move-Item build/release/bin/*.pdb build/release/symbols/
          windeployqt --release --no-translations build/release/bin/eden.exe
          if (Get-ChildItem -Recurse build/release/bin -Filter 'GFSDK_*') {
            throw 'build/release/bin holds Nsight Aftermath files, which must not ship'
          }
          $excluded = 'flyhighfg.bin', 'flyhighfg.json', 'graph.json', 'models.json', 'WEIGHTS_LICENSE.md'
          $unshippable = Get-ChildItem -Recurse -File build/release/bin | Where-Object { $_.Name -in $excluded }
          if ($unshippable) {
            throw "build/release/bin holds FlyHigh model files, which must not ship: $($unshippable.FullName -join ', ')"
          }

      # A self-contained app bundle: macdeployqt copies Qt and every other Homebrew library both
      # programs load into the bundle, then the leftover Homebrew and build-tree search paths are
      # removed so a machine with Homebrew still uses the bundled copies. Ad-hoc signed, not
      # notarized.
      - name: Package macOS app
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/eden.app
          test -x "$app/Contents/MacOS/eden"
          test -x build/release/bin/eden-cli
          cmp dist/nx2_switches.txt "$app/Contents/Resources/nx2_switches.txt"
          test ! -e "$app/Contents/MacOS/nx2_switches.txt"
          python3 tools/nx2/test_switches.py SwitchDiscovery.test_signed_macos_resources_and_precedence
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
            -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
            -always-overwrite -verbose=1
          # Qt's virtual keyboard input plugin pulls in the QML stack, which the emulator doesn't use.
          rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E -e '^/(opt/homebrew|usr/local)/' -e "^$GITHUB_WORKSPACE/" || true; } |
              while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          # Libraries that load their dependencies through @rpath find them in the bundle.
          for program in eden eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E -e '^\s+/(opt/homebrew|usr/local)/' -e "^\s+$GITHUB_WORKSPACE/"
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E -e '^/(opt/homebrew|usr/local)/' -e "^$GITHUB_WORKSPACE/"
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          # dyld refuses to start the app when a linked system library is missing, and libhvf.dylib
          # ships only with macOS 15.4 and later, newer than the 15.0 deployment target (#892).
          hvf=$(for binary in $binaries; do
            otool -L "$binary" | grep -F /usr/lib/libhvf.dylib > /dev/null && echo "$binary"
          done || true)
          if [ -n "$hvf" ]; then
            echo "::error::these link /usr/lib/libhvf.dylib, which macOS 15.0 to 15.3 lack: $hvf"
            exit 1
          fi
          # macdeployqt invalidates the signatures. The programs get the entitlements when the
          # tree has them (the Hypervisor CPU backend needs com.apple.security.hypervisor).
          codesign --force --deep --sign - "$app"
          if [ -f dist/eglantine.entitlements ]; then
            codesign --force --sign - --entitlements dist/eglantine.entitlements \
              "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "eden-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          ls -la "eden-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          # Also ship a .dmg (drag eden.app onto Applications).
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/eden.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "Eden" -srcfolder "$dmgdir" -ov -format UDZO \
            "eden-${GITHUB_SHA}-${{ matrix.platform }}.dmg"
          ls -la "eden-${GITHUB_SHA}-${{ matrix.platform }}.dmg"

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: eden-${{ matrix.platform }}${{ inputs.nsight_aftermath && '-aftermath' || '' }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows symbols
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.platform }}${{ inputs.nsight_aftermath && '-aftermath' || '' }}-${{ github.sha }}
          path: build/release/symbols/
          if-no-files-found: error
          retention-days: 90

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: eden-${{ matrix.platform }}-${{ github.sha }}
          path: |
            eden-${{ github.sha }}-${{ matrix.platform }}.tar.gz
            eden-${{ github.sha }}-${{ matrix.platform }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload macOS app
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: eden-${{ matrix.platform }}-${{ github.sha }}
          path: |
            eden-${{ github.sha }}-${{ matrix.platform }}.zip
            eden-${{ github.sha }}-${{ matrix.platform }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The Android APK, attached to the same release as the desktop binaries. Signed with the
  # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS secrets when they are set,
  # otherwise with the repo's public debug key.
  android:
    name: android-arm64 binary
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Keeps Gradle's downloads between runs: Maven Central answers runners with 429 when
          # every run fetches them again.
          cache: gradle

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          for attempt in 1 2 3; do
            bash .ci/linux/fast-apt.sh
            if sudo apt-get update && sudo apt-get install -y ccache glslang-tools ninja-build; then
              exit 0
            fi
            echo "apt-get failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: android-ccache-${{ github.sha }}
          restore-keys: android-ccache-

      - name: Restore CPM downloads
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/cpm
          key: android-cpm-${{ hashFiles('cpmfile.json', 'externals/cpmfile.json', 'src/**/cpmfile.json') }}
          restore-keys: android-cpm-

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with the public debug key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Use a Maven Central mirror
        # Maven Central answers shared runners with HTTP 429, sometimes for every attempt.
        run: |
          mkdir -p ~/.gradle/init.d
          cp .ci/android/maven-mirror.init.gradle ~/.gradle/init.d/

      - name: Build APK
        env:
          CCACHE: "true"
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
          # The APK's versionName: the release's version.
          GIT_TAG_NAME: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x .ci/android/build.sh
          # Maven Central rate-limits shared runners (HTTP 429); a build that failed only on that
          # is tried again after a pause, and Gradle keeps what it already fetched.
          for attempt in 1 2 3; do
            if .ci/android/build.sh -t standard -b Release 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
              break
            fi
            if [[ $attempt == 3 ]] || ! grep -q "Received status code 429" "$RUNNER_TEMP/android-build.log"; then
              exit 1
            fi
            echo "::warning::Maven Central rate-limited the build (HTTP 429); retrying in $((attempt * 60)) s"
            sleep $((attempt * 60))
          done
          apk=$(ls artifacts/*.apk | head -n 1)
          mv "$apk" "eden-${GITHUB_SHA}-android-arm64.apk"

      - name: Upload Android binary
        uses: actions/upload-artifact@v7
        with:
          name: eden-android-arm64-${{ github.sha }}
          path: eden-${{ github.sha }}-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  # Publishes every binary as a GitHub release once every platform built, unless "Publish the
  # binaries as a GitHub release" is unticked.
  # Runs even when a build leg failed or was cancelled (GitHub often has no macOS runner free and
  # cancels that leg after queuing): it publishes when every Windows, Linux and Android file is
  # there, with or without macOS.
  release:
    name: Publish release
    needs: [prepare-release, build, android]
    if: ${{ always() && inputs.publish_release && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      WITH_MACOS: ${{ inputs.macos }}
    permissions:
      contents: write
    steps:
      # Full history and tags, for the changelog since the previous release.
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: src

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: eden-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          # Asset names drop the commit sha: the release tag already identifies the build, and
          # stable names let the notes table link to them.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")
            if compgen -G "$artifact*.apk" > /dev/null; then
              for file in "$artifact"*.apk; do
                cp "$file" "dist/$(strip_sha "$(basename "$file")")"
              done
            elif compgen -G "$artifact*.AppImage" > /dev/null; then
              # Linux: ship the AppImage and the tar.gz as they are.
              for file in "$artifact"*.AppImage "$artifact"*.tar.gz; do
                cp "$file" "dist/$(strip_sha "$(basename "$file")")"
              done
            elif compgen -G "$artifact*.zip" > /dev/null; then
              for file in "$artifact"*.zip "$artifact"*.dmg; do
                [[ -e "$file" ]] && cp "$file" "dist/$(strip_sha "$(basename "$file")")"
              done
            elif [[ -n "$(ls -A "$artifact")" ]]; then
              (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/dist/$(strip_sha "$name").zip" .)
            fi
          done
          ls -la dist

          missing=()
          for file in eden-android-arm64.apk eden-windows-x86_64.zip eden-windows-x86_64-pgo.zip \
                      eden-linux-x86_64{,-pgo}.{AppImage,tar.gz} eden-linux-aarch64.{AppImage,tar.gz}; do
            [[ -e "dist/$file" ]] || missing+=("$file")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Not publishing, these builds are missing: ${missing[*]}"
            exit 1
          fi
          if [[ "$WITH_MACOS" == true && ! -e dist/eden-macos-arm64.zip ]]; then
            echo "::warning::Publishing without macOS: no macOS build (GitHub may have had no macOS runner). Re-run the macOS job and upload its files to the release later."
          fi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag ${tag} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          link() { [[ -e "dist/$2" ]] && echo "[$1](${base}/$2)" || true; }
          appimage_tar() {
            local appimage tar
            appimage=$(link AppImage "$1.AppImage")
            tar=$(link tar.gz "$1.tar.gz")
            echo "${appimage}${appimage:+${tar:+ · }}${tar}"
          }
          has_pgo=$(compgen -G 'dist/*-pgo.*' || true)
          row() {
            [[ -z "$2$3" ]] && return 0
            if [[ -n "$has_pgo" ]]; then echo "| $1 | $2 | $3 | $4 |"; else echo "| $1 | $2 | $4 |"; fi
          }
          table() {
            local rows
            rows=$(cat)
            [[ -z "$rows" ]] && return 0
            if [[ -n "$has_pgo" ]]; then
              printf '| Build Type | Standard | PGO (Recommended) | Notes |\n| --- | --- | --- | --- |\n'
            else
              printf '| Build Type | Standard | Notes |\n| --- | --- | --- |\n'
            fi
            echo "$rows"
          }
          pgo_note=""
          if [[ -n "$has_pgo" ]]; then
            pgo_note="The PGO builds are the same programs compiled with profile-guided optimization. Linux uses clang with Eglantine's profile; Windows uses clang-cl and ThinLTO with a profile trained in Eden on Ocarina of Time, so other games gain less. Prefer them when your CPU supports it."
          fi

          # Highlights: the run's "notes" input, else RELEASE_NOTES.md in the repo.
          highlights="${INPUT_NOTES}"
          if [[ -z "$highlights" && -f src/RELEASE_NOTES.md ]]; then
            highlights=$(cat src/RELEASE_NOTES.md)
          fi

          # Changelog: commits since the newest earlier release (vX.Y.Z, or build-N before 1.0.0) in
          # this commit's history. A run that failed after tagging leaves a tag without a release.
          prev=""
          for candidate in $(git -C src tag --merged "${GITHUB_SHA}" --sort=-creatordate 'v[0-9]*' 'build-*'); do
            [[ "$candidate" == "$tag" ]] && continue
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate}" --silent 2>/dev/null; then
              prev=$candidate
              break
            fi
          done
          if [[ -n "$prev" ]]; then
            count=$(git -C src rev-list --count "$prev..${GITHUB_SHA}")
            # git log stops by itself: piping it into head kills it with SIGPIPE once head has its
            # lines, and pipefail turns that into exit code 141 for the whole step.
            changes=$(git -C src log --no-merges --max-count=150 --format='- %s (%h)' "$prev..${GITHUB_SHA}")
            changelog="## Changes since ${prev}

          ${changes}
          $( (( count > 150 )) && echo "- …and more: see the full comparison" || true)

          Full comparison: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          else
            changelog="## Changes

          First release of this repository: Eden NX2 with Eden's and Hokkaido's optimizations under Eden's branding. See [docs/MIRROR_CHANGES.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/MIRROR_CHANGES.md) for what came from where."
          fi

          macos_note=""
          if [[ "$WITH_MACOS" != true ]]; then
            macos_note="

          **macOS:** not in this release."
          elif [[ ! -e dist/eden-macos-arm64.zip ]]; then
            macos_note="

          **macOS:** not in this build (GitHub had no macOS runner available); it will be added to this release when it builds."
          fi

          cat > notes.md <<EOF
          Build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Switch 2 support is experimental: expect rendering errors, stutters and crashes in some games. Games, keys and firmware are not included.${macos_note}

          ${highlights:+## Highlights

          ${highlights}
          }
          ${changelog}

          ## Android

          $(row "arm64 (Android 7.0+)" "$(link APK eden-android-arm64.apk)" "" "Install the APK (allow installs from unknown sources). Phones with Adreno, Mali, Xclipse or other Vulkan GPUs" | table)

          ## Linux

          Linux packages come as an AppImage and a tar.gz. Both are self-contained and need glibc 2.39 or newer (Ubuntu 24.04, Fedora 40, Debian 13, Arch). The tar.gz holds the same files unpacked, for systems without FUSE: extract it and run \`eden/eden\`.

          Linux ARM64 now ships only the standard build. If you use ARM64 PGO, the in-app updater in build 116 or newer offers the standard package of the same type. If no update appears on an older build, download the standard ARM64 package below.

          $({
            row amd64 "$(appimage_tar eden-linux-x86_64)" "$(appimage_tar eden-linux-x86_64-pgo)" "Make the AppImage executable (\`chmod +x\`) and run it"
            row "ARM (aarch64)" "$(appimage_tar eden-linux-aarch64)" "" ""
          } | table)

          ## Windows

          Windows packages are in-place zip files: extract and run \`eden.exe\`, or \`eden-cli.exe\` from a terminal.

          $({
            row "amd64 / x86_64" "$(link zip eden-windows-x86_64.zip)" "$(link "PGO zip" eden-windows-x86_64-pgo.zip)" "Both built with clang-cl and ThinLTO; the PGO zip adds a profile trained on Ocarina of Time"
          } | table)

          ## macOS

          $(row "arm64 (Apple Silicon)" "$(link zip eden-macos-arm64.zip)" "" "macOS 15 or newer. Not notarized: right-click and choose Open the first time, or run \`xattr -dr com.apple.quarantine eden.app\`. \`eden-cli\` is inside the app, in \`Contents/MacOS\`" | table)

          ${pgo_note}
          EOF

          prerelease_flag=--prerelease
          if [[ "${INPUT_PRERELEASE}" == "false" ]]; then
            prerelease_flag=--latest
          fi
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            ${prerelease_flag} \
            --title "Eden NX2 ${RELEASE_VERSION}" \
            --notes-file notes.md

      # EDEN_BUILD_TAG is baked into every binary as the release tag, and the update checker
      # compares release tags against it. A release whose tag or title names another version would
      # be skipped or offered wrongly, so fail the run instead of leaving it published.
      - name: Verify the release tag matches the version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          expected: ${{ needs.prepare-release.outputs.tag }}
          version: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          published_tag=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          published_title=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
          if [ "$published_tag" != "$expected" ] || [ "$published_title" != "Eden NX2 $version" ]; then
            echo "Release is tagged '$published_tag' and titled '$published_title', expected tag $expected and title 'Eden NX2 $version'"
            exit 1
          fi
